# Линтер: python -m ruff check reqcheck tools main.py (шаг CI). Тесты не проверяются: там длинные строки-данные.
target-version = "py311"
line-length = 150

[lint]
select = ["E", "F", "W", "B", "UP"]
# B905: zip() по спискам одной длины по построению; strict=True превратил бы будущую ошибку данных в падение отчёта
# UP038: isinstance(x, (A, B)) — привычная форма, правило устарело в самом ruff
ignore = ["B905", "UP038"]

[lint.per-file-ignores]
# Текст промптов — часть ключа кэша ответов модели: перенос строки поменял бы ключ и обнулил закоммиченный кэш
"reqcheck/prompts.py" = ["E501"]
