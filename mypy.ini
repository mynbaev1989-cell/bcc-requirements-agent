# Строгая типизация ядра, от которого зависит достоверность отчёта: модели данных и сверка цитат.
# python -m mypy  (шаг CI). Остальные модули проверяются тестами; расширять список по мере типизации.
[mypy]
python_version = 3.11
strict = True
files = reqcheck/models.py, reqcheck/grounding.py, reqcheck/schemas.py
