<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Архитектура агента reqcheck</title>
  <desc id="d">Верхний ряд — детерминированный код: чтение файла с диагностикой, нарезка на блоки, правила. Нижний ряд — роли LLM: Extractor, Reviewer, Consistency, Critic, Analyst. Затем код сверяет цитаты, считает вердикт и пишет отчёт.</desc>
  <rect width="1200" height="470" rx="24" fill="#f7f5ef"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b82"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="52" font-size="22" font-weight="700" fill="#0f1b2d">КОД (детерминированно)</text>
    <text x="160" y="276" font-size="22" font-weight="700" fill="#b0700a">LLM (роли агента, JSON-ответы)</text>

    <!-- Верхний ряд -->
    <g stroke="#0f1b2d" stroke-width="2" fill="#ffffff">
      <rect x="40" y="72" width="250" height="130" rx="14"/>
      <rect x="330" y="72" width="250" height="130" rx="14"/>
      <rect x="620" y="72" width="250" height="130" rx="14"/>
      <rect x="910" y="72" width="250" height="130" rx="14" fill="#0f1b2d"/>
    </g>
    <text x="60" y="110" font-size="22" font-weight="700" fill="#0f1b2d">1 Чтение</text>
    <text x="60" y="142" font-size="18" fill="#3c4a5e">MD · TXT · PDF · DOCX</text>
    <text x="60" y="170" font-size="18" fill="#3c4a5e">битый файл → диагностика</text>
    <text x="350" y="110" font-size="22" font-weight="700" fill="#0f1b2d">2 Нарезка</text>
    <text x="350" y="142" font-size="18" fill="#3c4a5e">разделы, таблицы, ID</text>
    <text x="350" y="170" font-size="18" fill="#3c4a5e">номера строк</text>
    <text x="640" y="110" font-size="22" font-weight="700" fill="#0f1b2d">3 Правила</text>
    <text x="640" y="142" font-size="18" fill="#3c4a5e">размытые слова, пустоты,</text>
    <text x="640" y="170" font-size="18" fill="#3c4a5e">единицы, версия, чек-лист</text>
    <text x="930" y="110" font-size="22" font-weight="700" fill="#f4f1ea">7 Сверка и вердикт</text>
    <text x="930" y="142" font-size="18" fill="#c9d4e3">цитата есть в тексте?</text>
    <text x="930" y="170" font-size="18" fill="#c9d4e3">баллы, итог, отчёт MD/PDF</text>

    <!-- Нижний ряд -->
    <g stroke="#b0700a" stroke-width="2" fill="#fff6e3">
      <rect x="40" y="300" width="200" height="130" rx="14"/>
      <rect x="265" y="300" width="200" height="130" rx="14"/>
      <rect x="490" y="300" width="200" height="130" rx="14"/>
      <rect x="715" y="300" width="200" height="130" rx="14"/>
      <rect x="940" y="300" width="220" height="130" rx="14"/>
    </g>
    <text x="58" y="338" font-size="22" font-weight="700" fill="#7a4a00">4 Extractor</text>
    <text x="58" y="370" font-size="18" fill="#5c4a2e">атомарные</text>
    <text x="58" y="396" font-size="18" fill="#5c4a2e">требования</text>
    <text x="283" y="338" font-size="22" font-weight="700" fill="#7a4a00">5 Reviewer</text>
    <text x="283" y="370" font-size="18" fill="#5c4a2e">10 критериев</text>
    <text x="283" y="396" font-size="18" fill="#5c4a2e">на требование</text>
    <text x="508" y="338" font-size="22" font-weight="700" fill="#7a4a00">5 Consistency</text>
    <text x="508" y="370" font-size="18" fill="#5c4a2e">противоречия,</text>
    <text x="508" y="396" font-size="18" fill="#5c4a2e">пропуски набора</text>
    <text x="733" y="338" font-size="22" font-weight="700" fill="#7a4a00">6 Critic</text>
    <text x="733" y="370" font-size="18" fill="#5c4a2e">снимает ложные</text>
    <text x="733" y="396" font-size="18" fill="#5c4a2e">находки</text>
    <text x="958" y="338" font-size="22" font-weight="700" fill="#7a4a00">8 Analyst</text>
    <text x="958" y="370" font-size="18" fill="#5c4a2e">чек-лист, тесты,</text>
    <text x="958" y="396" font-size="18" fill="#5c4a2e">трассировка</text>

    <!-- Стрелки -->
    <g stroke="#5b6b82" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M290 137 H326"/>
      <path d="M580 137 H616"/>
      <path d="M745 202 V236 H140 V296"/>
      <path d="M240 365 H261"/>
      <path d="M465 365 H486"/>
      <path d="M690 365 H711"/>
      <path d="M815 300 V250 H1035 V206"/>
      <path d="M1035 202 V230 H1050 V296"/>
    </g>
  </g>
</svg>
