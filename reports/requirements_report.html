h. На карту приходится максимум один такой push за календарный месяц.", "* **Ф-4.** При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "", "### Sequence Diagram", "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "", "### Нефункциональные требования", "Сервис передаёт push на отправку в течение минуты после получения события.", "", "### Требования к данным", "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге.", "", "### Требования к интеграции", "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API». Повторная доставка одного события процессинга сохраняет исходный итог.", "", "### Требования к тестированию", "", "#### Тестирование требований", "заполняются тестировщиками", "", "### Критерии приемки", "", "| Исходные условия | Действие | Ожидаемый результат |", "| :--- | :--- | :--- |", "| Расходы 48 500 ₸, порог 50 000 ₸ | Провести покупку на 1 500 ₸ | Итог 50 000 ₸ и один push |", "| Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸ |", "| Расходы 19 900 ₸, порог 20 000 ₸ | Перевести 500 ₸ | Счётчик показывает 19 900 ₸ |", "", "### Ревью требований", "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", "", "| Проверка | Создано или доступно | Проверено | Примечания |", "| :--- | :--- | :--- | :--- |", "| Техническое требование зафиксировано и покрывает бизнес-требование | Да / Нет | Да / Нет | |", "| Функциональная спецификация имеет структурированное описание (по стандарту, шаблону) | Да / Нет | Да / Нет | |", "| Sequence-диаграммы, предусмотрены взаимодействия сист бкой"], "assumption": "Сервис использует строго коды 400, 401, 404, 500.", "fids": ["F-013"], "lines": [151], "answer": ""}, {"qid": "Q-14", "text": "Раздел 'Тестирование требований' (строка 57) и чек-лист ревью (строка 72) не заполнены. Кто и в какие сроки заполнит эти разделы?", "priority": "important", "addressee": "QA", "why": "Отсутствие согласованных критериев тестирования и ревью блокирует старт тест-дизайна.", "options": ["QA-лид заполнит до этапа тест-дизайна", "Аналитик заполнит совместно с QA до передачи задачи в разработку"], "assumption": "Разделы будут заполнены QA-инженером до начала фазы тестирования.", "fids": ["F-018", "F-019"], "lines": [57, 72], "answer": ""}, {"qid": "Q-15", "text": "Параметры должны передаваться в URL query или в теле запроса в формате JSON?", "priority": "important", "addressee": "Аналитик", "why": "Пример cURL отправляет GET-запрос с query-параметрами вместо POST-запроса с телом в формате application/json.", "options": ["Принять исправление: Привести cURL к виду: curl -X POST \"$BASE/alerts/saveLimit\" -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" -d '{\"cardId\":\"demo-42\",\"amount\":50000,\"enabled\":1}'", "Оставить как есть: пояснить, почему это не дефект"], "assumption": "До ответа в тест-кейсах ожидаемый результат помечается как «требует уточнения».", "fids": ["F-008"], "lines": [109], "answer": ""}, {"qid": "Q-16", "text": "В документе 41 требование не имеет ID (F-021), а неатомарные пункты R-004, R-005, R-045 объединяют по несколько условий (F-026). Будет ли проведена декомпозиция и присвоены уникальные ID?", "priority": "clarify", "addressee": "Аналитик", "why": "Сложность трассировки требований на автотесты и задачи в Jira.", "options": ["Да, аналитик проведет нумерацию и декомпозицию требований", "Оставить в текущем виде, ссылаться по номерам строк"], "assumption": "Документ останется в текущей структуре, ссылки осуществляются по номерам строк/пунктов.", "fids": ["F-021", "F-026"], "lines": [29, 37, 38, 189], "answer": ""}, {"qid": "Q-17", "text": "Таблица 'Блок согласующих' (строка 87) и версия/дата документа (строка 68) не заполнены. Зафиксируете ли финальный статус документа?", "priority": "clarify", "addressee": "Аналитик", "why": "Риск разработки по несогласованной или устаревшей версии спецификации.", "options": ["Аналитик укажет версию 1.0, дату и список согласующих до старта спринта", "Согласование пройдет в Jira без заполнения таблицы в документе"], "assumption": "Версия документа признается 1.0 от текущей даты, согласование фиксируется в Jira.", "fids": ["F-022", "F-023"], "lines": [68, 87], "answer": ""}, {"qid": "Q-18", "text": "В строке 49 используются 'тенге' и 'тиыны' (F-024), а в параметрах ответа API `amount` и `enabled` указаны как string, хотя в запросе они integer (F-025). Каковы единые типы для API?", "priority": "clarify", "addressee": "Разработка", "why": "Ошибки формата при парсинге JSON на фронтенде/мобильном клиенте и ошибки конверсии денег.", "options": ["В API передавать amount как integer в тенге, enabled как integer (0/1); в БД хранить суммы в тиынах (BigInt)", "В API все значения передавать строками (string)"], "assumption": "В API amount и enabled передаются как integer (сумма в тенге), в хранилище сумма конвертируется в тиыны.", "fids": ["F-024", "F-025"], "lines": [49, 143, 156], "answer": ""}, {"qid": "Q-19", "text": "Мелкие замечания (1: F-012): принять предложенные исправления или оставить формулировки документа?", "priority": "clarify", "addressee": "Аналитик", "why": "Мелкие неточности формулировок копятся и замедляют тест-дизайн; ответ позволяет закрыть их одним решением.", "options": ["Принять все предложенные исправления", "Принять, кроме перечисленных номеров находок", "Оставить формулировки документа как есть"], "assumption": "Команда применяет предложенные исправления и фиксирует это в протоколе ревью.", "fids": ["F-012"], "lines": [147], "answer": ""}], "requirements": [{"rid": "R-001", "source_id": "", "summary": "Элементы экрана настроек уведомлений в мобильном банке", "quote": "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».", "kind": "ui", "line_start": 29, "line_end": 29, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Дизайн процесса UI", "score": 90, "light": "green"}, {"rid": "R-002", "source_id": "", "summary": "Отображение сообщения об ошибке под полем ввода", "quote": "При ошибке ввода сообщение появляется под полем.", "kind": "ui", "line_start": 29, "line_end": 29, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Дизайн процесса UI", "score": 90, "light": "green"}, {"rid": "R-003", "source_id": "", "summary": "Процесс обработки покупки и отправки уведомления", "quote": "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.", "kind": "functional", "line_start": 34, "line_end": 34, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Требования к изменениям › BPMN схема процесса", "score": 90, "light": "green"}, {"rid": "R-004", "source_id": "Ф-1", "summary": "Установка порога расходов для карты KZT", "quote": "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено.", "kind": "functional", "line_start": 37, "line_end": 37, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Требования к изменениям › Функциональные требования", "score": 92, "light": "green"}, {"rid": "R-005", "source_id": "Ф-2", "summary": "Правила расчёта месячных расходов по карте", "quote": "Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются.", "kind": "functional", "line_start": 38, "line_end": 38, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Требования к изменениям › Функциональные требования", "score": 92, "light": "green"}, {"rid": "R-006", "source_id": "Ф-3", "summary": "Условия отправки push-уведомления при достижении порога", "quote": "Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push. На карту приходится максимум один такой push за календарный месяц.", "kind": "functional", "line_start": 39, "line_end": 39, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Требования к изменениям › Функциональные требования", "score": 100, "light": "green"}, {"rid": "R-007", "source_id": "Ф-4", "summary": "Поведение системы при изменении порога расходов", "quote": "При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", "kind": "functional", "line_start": 40, "line_end": 40, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Требования к изменениям › Функциональные требования", "score": 100, "light": "green"}, {"rid": "R-008", "source_id": "", "summary": "Взаимодействие систем при обработке покупки и отправке push", "quote": "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", "kind": "integration", "line_start": 43, "line_end": 43, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Sequence Diagram", "score": 90, "light": "green"}, {"rid": "R-009", "source_id": "", "summary": "Ограничение по времени передачи push-уведомления", "quote": "Сервис передаёт push на отправку в течение минуты после получения события.", "kind": "nonfunctional", "line_start": 46, "line_end": 46, "section": "Уведомление о расходах по карте › Часть A. Новый функционал › Нефункциональные требования", "score": 70, "light": "yellow"}, {"rid": "R-010", "source_id": "", "summary": "Состав хранимых данных по операциям и настрой source_id": "", "summary": "Параметр ответа enabled", "quote": "Parameter: enabled; Format: string; Logic: «0» или «1»; Description: Признак включения; DB field: enabled", "kind": "api", "line_start": 157, "line_end": 157, "section": "Уведомление о расходах по карте › Часть B. REST API › Ответ", "score": 90, "light": "green"}, {"rid": "R-039", "source_id": "", "summary": "Параметр ответа message", "quote": "Parameter: message; Format: string; Logic: При ошибке; Description: Описание ошибки; DB field: —", "kind": "api", "line_start": 158, "line_end": 158, "section": "Уведомление о расходах по карте › Часть B. REST API › Ответ", "score": 90, "light": "green"}, {"rid": "R-040", "source_id": "", "summary": "Статус ответа 200 при успешном выполнении", "quote": "**200.** Ответ в случае успешного выполнения метода.", "kind": "api", "line_start": 162, "line_end": 163, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы", "score": 85, "light": "green"}, {"rid": "R-041", "source_id": "", "summary": "Статус ответа 400 при неверных параметрах запроса", "quote": "**400.** Ответ в случае, если параметры запроса заполнены неверно.", "kind": "api", "line_start": 162, "line_end": 163, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы", "score": 70, "light": "yellow"}, {"rid": "R-042", "source_id": "", "summary": "Статус ответа 401 при отсутствии авторизации", "quote": "**401.** Ответ в случае, если запрос выполнен без необходимой авторизации.", "kind": "api", "line_start": 174, "line_end": 176, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы › 200. Successful — Created", "score": 90, "light": "green"}, {"rid": "R-043", "source_id": "", "summary": "Статус ответа 403 при запрете доступа к ресурсу", "quote": "**403.** Ответ в случае, если на указанный ресурс доступ запрещен.", "kind": "api", "line_start": 174, "line_end": 176, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы › 200. Successful — Created", "score": 70, "light": "yellow"}, {"rid": "R-044", "source_id": "", "summary": "Статус ответа 500 при внутренней ошибке сервера", "quote": "**500.** Ответ в случае, если произошла внутренняя ошибка сервера.", "kind": "api", "line_start": 174, "line_end": 176, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы › 200. Successful — Created", "score": 90, "light": "green"}, {"rid": "R-045", "source_id": "", "summary": "Статус ответа 404 для чужой или отсутствующей карты", "quote": "Для чужой карты возвращается 404, как и для отсутствующей карты.", "kind": "api", "line_start": 189, "line_end": 190, "section": "Уведомление о расходах по карте › Часть B. REST API › Статусы › 403. Unsuccessful — Forbidden", "score": 82, "light": "green"}], "sev_ru": {"critical": "критичный", "major": "существенный", "minor": "незначительный"}, "priority_ru": {"blocker": "блокирует разработку", "important": "нужно до тест-дизайна", "clarify": "можно уточнить по ходу"}, "passport": {"input_path": "input/requirements.md", "sha256": "8c2b35d617f1629bef0871ec058658b51b2dc093b75eadb3cb59487f4e7da6b5", "report_questions_file": "requirements_report_questions.md"}}</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent);
var SEV=["critical","major","minor"],RANK={critical:0,major:1,minor:2};
// Создать элемент; текст всегда через textContent (никакого innerHTML)
function el(tag,cls,text,parent){var e=document.createElement(tag);if(cls)e.className=cls;
 if(text!==undefined&&text!==null)e.textContent=text;if(parent)parent.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

// Шапка
$("title").textContent=D.title;
$("vdev").textContent=D.verdict_dev||"—";
$("vtest").textContent=D.verdict_test||"—";
var st=$("stats");
if(D.score!==null&&D.score!==undefined)el("span","chip","Балл: "+D.score+"/100",st);
el("span","chip","Требований: "+D.n_requirements,st);
SEV.forEach(function(s){el("span","chip "+s,D.sev_ru[s]+": "+D.counts[s],st);});
el("span","chip","Вопросов: "+D.n_questions+" (без ответа "+D.n_open_questions+")",st);
el("span","chip"+(D.n_blockers?" critical":""),"Блокеров: "+D.n_blockers,st);

// Строки документа: на каждую строку — худшая критичность и список находок
var lineSev={},lineF={};
D.findings.forEach(function(f){f.quotes.forEach(function(q){
 if(!q.line)return;
 var cur=lineSev[q.line];
 if(cur===undefined||RANK[f.severity]<RANK[cur])lineSev[q.line]=f.severity;
 (lineF[q.line]=lineF[q.line]||[]);if(lineF[q.line].indexOf(f.fid)<0)lineF[q.line].push(f.fid);});});
var docEl=$("doc"),lineEls={};
D.lines.forEach(function(t,i){var n=i+1;
 var row=el("div","ln"+(lineSev[n]?" "+lineSev[n]:""),null,docEl);row.id="L"+n;
 el("span","n",String(n),row);el("span","t",t,row);lineEls[n]=row;
 if(lineF[n])row.addEventListener("click",function(){openFindings(lineF[n]);});});
function flash(n){var r=lineEls[n];if(!r)return;
 docEl.scrollTo({top:r.offsetTop-docEl.clientHeight/3,behavior:"smooth"});
 r.classList.remove("flash");void r.offsetWidth;r.classList.add("flash");}

// Вкладки
function showTab(name){document.querySelectorAll(".tab").forEach(function(b){
 b.setAttribute("aria-selected",b.dataset.tab===name?"true":"false");});
 ["findings","questions","reqs"].forEach(function(t){$("pane-"+t).hidden=(t!==name);});}
document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){showTab(b.dataset.tab);});});

// Фильтр критичности
var on={critical:true,major:true,minor:true},fbox=$("filters");
SEV.forEach(function(s){var l=el("label",null,null,fbox),c=document.createElement("input");
 c.type="checkbox";c.checked=true;c.addEventListener("change",function(){on[s]=c.checked;applyFilter();});
 l.appendChild(c);l.appendChild(document.createTextNode(" "+D.sev_ru[s]));});
function applyFilter(){document.querySelectorAll("#flist .card").forEach(function(c){c.hidden=!on[c.dataset.sev];});}

// Карточки находок
var cards={};
function lineRef(n,parent){var a=el("a","lnk","стр. "+n,parent);a.addEventListener("click",function(e){e.stopPropagation();flash(n);});}
var fl=$("flist");
if(!D.findings.length)el("div","empty","Находок нет.",fl);
D.findings.forEach(function(f){
 var c=el("div","card "+f.severity,null,fl);c.dataset.sev=f.severity;cards[f.fid]=c;
 el("div","meta",f.fid+" · "+(D.sev_ru[f.severity]||f.severity)+" · "+f.criterion+(f.rids.length?" · "+f.rids.join(", "):""),c);
 el("h3",null,f.title,c);
 if(f.explanation)el("div",null,f.explanation,c);
 if(f.example)el("div","meta","Пример: "+f.example,c);
 f.quotes.forEach(function(q){var d=el("div","quote",q.text,c);if(q.line){d.appendChild(document.createTextNode(" "));lineRef(q.line,d);}});
 if(f.suggestion){var s=el("div","sugg",null,c);el("span","lbl","Предложение: ",s);s.appendChild(document.createTextNode(f.suggestion));}
 if(f.resolution)el("div","meta","Учёт ответа автора: "+f.resolution,c);
 c.addEventListener("click",function(){
  Object.keys(cards).forEach(function(k){cards[k].classList.remove("sel");});c.classList.add("sel");
  var first=f.quotes.filter(function(q){return q.line;})[0];if(first)flash(first.line);});});
function openFindings(fids){showTab("findings");
 SEV.forEach(function(s){on[s]=true;});fbox.querySelectorAll("input").forEach(function(i){i.checked=true;});applyFilter();
 Object.keys(cards).forEach(function(k){cards[k].classList.remove("sel");});
 fids.forEach(function(id){if(cards[id])cards[id].classList.add("sel");});
 if(cards[fids[0]])cards[fids[0]].scrollIntoView({behavior:"smooth",block:"center"});}

// Вопросы
var qs=[],ql=$("qlist");
if(!D.questions.length)el("div","empty","Вопросов нет.",ql);
D.questions.forEach(function(q){
 var c=el("div","card"+(q.priority==="blocker"?" critical":""),null,ql);
 el("div","meta",q.qid+" · "+(D.priority_ru[q.priority]||q.priority)+" · Кому: "+q.addressee,c);
 el("h3",null,q.text,c);
 if(q.why){var w=el("div",null,null,c);el("span","lbl","Почему важно: ",w);w.appendChild(document.createTextNode(q.why));}
 var radios=[];
 q.options.forEach(function(o,i){var l=el("label","opt",null,c),r=document.createElement("input");
  r.type="radio";r.name="opt-"+q.qid;l.appendChild(r);l.appendChild(document.createTextNode(" "+(i+1)+") "+o));
  l.addEventListener("dblclick",function(){r.checked=false;});radios.push(r);});
 if(q.assumption)el("div","meta","Если ответа не будет: "+q.assumption,c);
 if(q.fids.length){var m=el("div","meta","Находки: ",c);
  q.fids.forEach(function(id,i){if(i)m.appendChild(document.createTextNode(", "));
   var a2=el("a","lnk",id,m);a2.addEventListener("click",function(){openFindings([id]);});});}
 var ta=el("textarea",null,null,c);ta.placeholder="Свой ответ";ta.value=q.answer||"";
 qs.push({q:q,radios:radios,ta:ta});});

// Файл ответов: тот же формат, что у <отчёт>_questions.md (его читает clarify.parse_answers)
function answerOf(x){var parts=[];
 x.radios.forEach(function(r,i){if(r.checked)parts.push("Вариант "+(i+1)+": "+x.q.options[i]);});
 var t=x.ta.value.trim();if(t)parts.push(t);
 // строка вида «## Q-…» в ответе оборвала бы блок при разборе
 return parts.join("\n").replace(/^(\s*##\s+Q-)/gm," $1");}
function buildFile(){
 var p=D.passport,L=["# Вопросы агента автору требований: "+D.title,""];
 if(p.sha256)L.push("Документ: `"+p.input_path+"` (SHA-256 "+p.sha256.slice(0,16)+"…)","");
 L.push("Ответы собраны в HTML-отчёте. Сохраните файл и запустите повторно с параметром --answers.","");
 qs.forEach(function(x){var q=x.q;
  L.push("## "+q.qid+" · "+(D.priority_ru[q.priority]||q.priority)+" · Кому: "+q.addressee,"","Вопрос: "+q.text);
  if(q.why)L.push("Почему важно: "+q.why);
  if(q.options.length)L.push("Варианты: "+q.options.map(function(o,i){return "("+(i+1)+") "+o;}).join("; "));
  if(q.assumption)L.push("Если ответа не будет: "+q.assumption);
  var refs=q.fids.join(", ");if(q.lines.length)refs+=" (строки: "+q.lines.join(", ")+")";
  L.push("Находки: "+refs);
  L.push(("Ответ: "+answerOf(x)).replace(/\s+$/,""),"");});
 return L.join("\n")+"\n";}
$("dl").addEventListener("click",function(){
 var blob=new Blob([buildFile()],{type:"text/markdown;charset=utf-8"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=D.passport.report_questions_file||"report_questions.md";
 document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);});

// Требования
var rl=$("rlist");
if(!D.requirements.length)el("div","empty","Требований нет.",rl);
D.requirements.forEach(function(r){var c=el("div","card",null,rl);
 el("div","meta",r.rid+(r.source_id?" · "+r.source_id:"")+" · "+r.kind+(r.score!==null?" · балл "+r.score+"/100":"")+" · "+r.section,c);
 el("div",null,r.summary,c);if(r.quote)el("div","quote",r.quote,c);
 var a=el("a","lnk","стр. "+r.line_start+(r.line_end!==r.line_start?"–"+r.line_end:""),c);
 a.addEventListener("click",function(){flash(r.line_start);});});
})();
</script>
</body>
</html>
